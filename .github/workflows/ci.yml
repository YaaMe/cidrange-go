name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version go.mod declares support for, the first release
        # with the Swiss-table map (which changes lookup cost materially, see
        # the README), and current stable.
        go: ["1.19", "1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 10x ./...

      # bench/ is a separate module holding provider corpora. Running it here
      # checks the library against eight providers' real ranges rather than the
      # single snapshot in testdata/.
      - name: bench module
        run: cd bench && go test -count=1 ./...
